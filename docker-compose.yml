volumes:
  data:
    driver: local

services:
  mongo:
    image: mongo
    restart: always
    ports:
      - 8081:27017
    volumes:
      - data:/data/db

  app:
    image: wraith29/dashboard-app
    build:
      dockerfile: ./Dockerfile
    restart: always
    depends_on:
      - mongo
    env_file:
      - .env
      - .flaskenv
    environment:
      - FLASK_DEBUG=false
    ports:
      - "5000:5000"
    links:
      - "mongo:database"

  web:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    ports:
      - "80:80"